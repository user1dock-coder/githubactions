name: Terraform Plan

on:
  pull_request:
    branches: [ develop, test, main ]

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Determine environment based on PR target branch
      - name: Set environment directory
        id: envdir
        run: |
          if [[ "${GITHUB_BASE_REF}" == "develop" ]]; then
            echo "env=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_BASE_REF}" == "test" ]]; then
            echo "env=test" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_BASE_REF}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "Unknown branch ${GITHUB_BASE_REF}"
            exit 1
          fi

      # Terraform FMT, Validate, and Plan for both groups & users
      - name: Terraform Fmt / Validate / Plan (users + groups)
        run: |
          ENV_DIR=tfprojects/env/${{ steps.envdir.outputs.env }}
          for dir in groups users; do
            echo " Running Terraform in $ENV_DIR/$dir ..."
            terraform -chdir=$ENV_DIR/$dir init -input=false
            terraform -chdir=$ENV_DIR/$dir fmt -check
            terraform -chdir=$ENV_DIR/$dir validate
            terraform -chdir=$ENV_DIR/$dir plan -out=tfplan
          done
