name: Terraform Plan

on:
  pull_request:
    branches: [ develop, test, main ]
  push:
    branches: [ develop ]

jobs:
  terraform-plan:
    runs-on: windows-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=tfprojects/env/dev/groups init

      - name: Terraform Validate
        run: terraform -chdir=tfprojects/env/dev/groups validate

      - name: Terraform Plan
        run: |
          for dir in users groups; do
            terraform -chdir=tfprojects/env/dev/$dir init
            terraform -chdir=tfprojects/env/dev/$dir plan -out=tfplan-$dir
          done
        shell: bash
